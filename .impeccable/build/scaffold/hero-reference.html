<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f2f6f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1344px">
  <div class="r-nav-mark region chrome" data-region="nav-mark"><!-- blue double-slash monogram mark with navy dot --></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- nav links Work, Skills, Experience, Contact in navy medium sans --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-headline region text" data-region="headline"><!-- huge bold geometric sans headline 'Mohamed Emad' in deep navy --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-accent-rule region chrome" data-region="accent-rule"><!-- short electric blue underline rule under headline --></div>
  <div class="r-subhead region text" data-region="subhead"><!-- two-line subhead 'Software Engineer. I build products end to end.' slate navy regular --><p style="font-size:var(--r-subhead-font);line-height:1.05;margin:0">subhead</p></div>
  <div class="r-cta-primary region control" data-region="cta-primary"><!-- solid electric blue button 'View projects' with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-primary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cta-secondary region control" data-region="cta-secondary"><!-- outlined navy button 'Download CV' with download icon: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-secondary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-dot-field region chrome" data-region="dot-field"><!-- faint CSS radial-gradient dot pattern at lower left --></div>
  <div class="r-tech-icons region chrome" data-region="tech-icons"><!-- row of outline tech logo icons: JS, React, Node, Laravel, PostgreSQL, Flutter, Socket --></div>
  <figure class="r-stack-plate region plate" data-region="stack-plate"><img src="../../../assets/plates/stack-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-db region text" data-region="label-db"><!-- label 'PostgreSQL + PostGIS' with dot --><p style="font-size:var(--r-label-db-font);line-height:1.05;margin:0">label-db</p></div>
  <div class="r-label-api region text" data-region="label-api"><!-- label 'Node.js / Laravel API' with dot --><p style="font-size:var(--r-label-api-font);line-height:1.05;margin:0">label-api</p></div>
  <div class="r-label-dash region text" data-region="label-dash"><!-- label 'React dashboard' with dot --><p style="font-size:var(--r-label-dash-font);line-height:1.05;margin:0">label-dash</p></div>
  <div class="r-label-mobile region text" data-region="label-mobile"><!-- label 'Flutter app' with dot --><p style="font-size:var(--r-label-mobile-font);line-height:1.05;margin:0">label-mobile</p></div>
  <div class="r-tag-jwt region text" data-region="tag-jwt"><!-- small left label 'JWT · RBAC' --><p style="font-size:var(--r-tag-jwt-font);line-height:1.05;margin:0">tag-jwt</p></div>
  <div class="r-tag-socket region text" data-region="tag-socket"><!-- small left label 'Socket.IO' --><p style="line-height:1.05;margin:0">tag-socket</p></div>
  <div class="r-tag-play region text" data-region="tag-play"><!-- small left label 'Google Play' --><p style="font-size:var(--r-tag-play-font);line-height:1.05;margin:0">tag-play</p></div>
</main>
</body>
</html>
